services:
  fah0:
    image: foldingathome/fah-gpu-bastet:${VERSION:-25.11.0}-rocm
    build:
      context: .
      dockerfile: Dockerfile.amd
      args:
        ROCM_RELEASE: "${ROCM_RELEASE:-6.4.4}"
      tags:
        - "foldingathome/fah-gpu-bastet:rocm${ROCM_RELEASE:-6.4.4}"
        - "foldingathome/fah-gpu-bastet:${VERSION:-25.11.0}-rocm${ROCM_RELEASE:-6.4.4}"
    ports:
      - "7396:7396"
    # Options for AMD ROCm
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    security_opt:
      - seccomp=unconfined
    group_add:
      - "video"
      - "${RENDER_GID:-render}"
    # Options for setting local directory
    # user: "$(id -u):$(id -g)"
    # volumes:
    #  - "/etc/machine-id:/etc/machine-id:ro"
    #  - "${HOME}/fah:/fah"
