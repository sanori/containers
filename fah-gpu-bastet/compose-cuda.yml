services:
  client:
    image: foldingathome/fah-gpu-bastet:cuda
    build:
      context: .
      dockerfile: Dockerfile.nvidia
      args:
        FAH_CLIENT_VERSION: "${FAH_CLIENT_VERSION}"
        FAH_CLIENT_SHA256SUM: "${FAH_CLIENT_SHA256SUM}"
        CUDA_RELEASE: "${CUDA_RELEASE:-11.7.1}"
      tags:
        - "foldingathome/fah-gpu-bastet:cuda${CUDA_RELEASE:-11.7.1}"
        - "foldingathome/fah-gpu-bastet:${VERSION:-26.07.0}-cuda"
        - "foldingathome/fah-gpu-bastet:${VERSION:-26.07.0}-cuda${CUDA_RELEASE:-11.7.1}"
    ports:
      - "127.0.0.1:7396:7396"
    # Options for nVidia CUDA
    gpus: all
    # Options for setting local directory
    # user: "1000:1000"
    # volumes:
    #  - "/etc/machine-id:/etc/machine-id:ro"
    #  - "${HOME}/fah:/fah"
